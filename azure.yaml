# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: telemetry-demo
metadata:
  template: telemetry-demo@0.0.1-beta
infra:
  path: infra
  module: main

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/tag-resource-group.ps1
    posix:
      shell: pwsh
      run: ./scripts/tag-resource-group.ps1
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/deploy.ps1
    posix:
      shell: pwsh
      run: ./scripts/deploy.ps1
